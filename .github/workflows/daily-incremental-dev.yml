name: StockWaveScanner V2 Daily Incremental DEV

on:
  schedule:
    # Taiwan 18:47 = UTC 10:47
    # Monday ~ Friday
    - cron: "47 10 * * 1-5"

  workflow_dispatch:
    inputs:
      through:
        description: "Optional through date (YYYY-MM-DD). Leave empty for Taiwan today."
        required: false
        type: string


permissions:
  contents: read


concurrency:
  group: stockwavescanner-daily-dev
  cancel-in-progress: false


jobs:
  daily-incremental:

    name: Daily Incremental DEV

    # ========================================================
    # IMPORTANT
    #
    # TPEx official endpoints currently have TLS certificate
    # chain compatibility issues on Ubuntu/OpenSSL.
    #
    # StockWaveScanner is developed and validated on Windows,
    # where TPEx official sources work correctly through the
    # Windows certificate / Schannel environment.
    #
    # Do NOT disable TLS certificate verification.
    # ========================================================

    runs-on: windows-latest

    timeout-minutes: 30


    # ========================================================
    # All command blocks use Git Bash.
    #
    # This keeps workflow commands consistent between
    # Windows GitHub Runner and our shell scripts below.
    # ========================================================

    defaults:
      run:
        shell: bash


    env:

      PYTHONUNBUFFERED: "1"

      TURSO_DEV_DATABASE_URL: ${{ secrets.TURSO_DEV_DATABASE_URL }}
      TURSO_DEV_AUTH_TOKEN: ${{ secrets.TURSO_DEV_AUTH_TOKEN }}


    steps:

      # ======================================================
      # Checkout
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v7


      # ======================================================
      # Python
      # ======================================================

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:

          python-version: "3.13"

          cache: "pip"

          cache-dependency-path: requirements-daily.txt


      # ======================================================
      # Runtime Information
      # ======================================================

      - name: Show runtime information
        run: |

          python --version

          python -c "import sys; print('Python executable:', sys.executable)"

          pip --version

          echo "Runner OS: $RUNNER_OS"

          echo "Repository: $GITHUB_REPOSITORY"

          echo "Branch: $GITHUB_REF_NAME"


      # ======================================================
      # DEV Secret Preflight
      #
      # Only validate existence.
      # Never print the token.
      # ======================================================

      - name: Validate DEV secrets
        run: |

          if [ -z "$TURSO_DEV_DATABASE_URL" ]; then

            echo "::error::Missing GitHub Secret: TURSO_DEV_DATABASE_URL"

            exit 1

          fi


          if [ -z "$TURSO_DEV_AUTH_TOKEN" ]; then

            echo "::error::Missing GitHub Secret: TURSO_DEV_AUTH_TOKEN"

            exit 1

          fi


          case "$TURSO_DEV_DATABASE_URL" in

            *stockwave-dev*)

              ;;

            *)

              echo "::error::TURSO_DEV_DATABASE_URL does not point to stockwave-dev"

              exit 1

              ;;

          esac


          case "$TURSO_DEV_DATABASE_URL" in

            *stockwave-prod*)

              echo "::error::PROD database detected. Workflow aborted."

              exit 1

              ;;

          esac


          echo "[PASS] DEV secrets configured"

          echo "[PASS] PROD protection"


      # ======================================================
      # Dependencies
      # ======================================================

      - name: Install Python dependencies
        run: |

          python -m pip install --upgrade pip

          python -m pip install -r requirements-daily.txt


      # ======================================================
      # Dependency Smoke Test
      # ======================================================

      - name: Validate Python dependencies
        run: |

          python -c "import libsql; import dotenv; print('[PASS] libsql import'); print('[PASS] python-dotenv import')"


      # ======================================================
      # Syntax Validation
      # ======================================================

      - name: Validate Daily Pipeline scripts
        run: |

          python -m py_compile \
            scripts/sync_stock_master.py \
            scripts/sync_market_index_incremental.py \
            scripts/sync_daily_price_incremental.py \
            scripts/sync_institutional_incremental.py \
            scripts/daily_incremental_pipeline.py

          echo "[PASS] Daily Pipeline syntax validation"


      # ======================================================
      # Daily Incremental Pipeline
      # ======================================================

      - name: Run Daily Incremental Pipeline
        run: |

          THROUGH="${{ github.event.inputs.through }}"


          if [ -n "$THROUGH" ]; then

            echo "Manual through date: $THROUGH"

            python scripts/daily_incremental_pipeline.py \
              --through "$THROUGH"

          else

            echo "Through date: Taiwan today"

            python scripts/daily_incremental_pipeline.py

          fi


      # ======================================================
      # Success
      # ======================================================

      - name: Workflow completed
        if: success()
        run: |

          echo "========================================"

          echo "StockWaveScanner V2"

          echo "Daily Incremental DEV completed"

          echo "Runner: Windows"

          echo "========================================"