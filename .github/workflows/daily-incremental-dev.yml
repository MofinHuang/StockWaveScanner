name: StockWaveScanner V3 Daily Incremental DEV

on:
  schedule:
    # Taiwan 16:00 = UTC 08:00
    # Monday ~ Friday
    - cron: "0 8 * * 1-5"

  workflow_dispatch:
    inputs:
      through:
        description: "Optional through date (YYYY-MM-DD). Leave empty for Taiwan today."
        required: false
        type: string

      skip_stock_master:
        description: "Skip Stock Master for manual retry/debug"
        required: false
        type: boolean
        default: false


permissions:
  contents: read


concurrency:
  group: stockwavescanner-daily-dev
  cancel-in-progress: false


jobs:

  daily-incremental:

    name: Daily Incremental DEV

    runs-on: windows-latest

    timeout-minutes: 40


    defaults:
      run:
        shell: bash


    env:

      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

      TURSO_DEV_DATABASE_URL: ${{ secrets.TURSO_DEV_DATABASE_URL }}
      TURSO_DEV_AUTH_TOKEN: ${{ secrets.TURSO_DEV_AUTH_TOKEN }}


    steps:

      # ======================================================
      # Checkout
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v7


      # ======================================================
      # Python
      # ======================================================

      - name: Set up Python 3.13
        uses: actions/setup-python@v7

        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-daily.txt


      # ======================================================
      # Runtime
      # ======================================================

      - name: Show runtime information
        run: |

          python --version

          python -c "import sys; print('Python executable:', sys.executable)"

          python -c "import sys; print('stdout encoding:', sys.stdout.encoding)"

          python -c "print('UTF-8 test: 台泥 / 亞泥 / 上櫃 / 族群')"

          pip --version

          echo "Runner OS: $RUNNER_OS"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"


      # ======================================================
      # DEV SAFETY
      # ======================================================

      - name: Validate DEV secrets
        run: |

          if [ -z "$TURSO_DEV_DATABASE_URL" ]; then

            echo "::error::Missing GitHub Secret: TURSO_DEV_DATABASE_URL"

            exit 1

          fi


          if [ -z "$TURSO_DEV_AUTH_TOKEN" ]; then

            echo "::error::Missing GitHub Secret: TURSO_DEV_AUTH_TOKEN"

            exit 1

          fi


          case "$TURSO_DEV_DATABASE_URL" in

            *stockwave-dev*)
              ;;

            *)

              echo "::error::TURSO_DEV_DATABASE_URL does not point to stockwave-dev"

              exit 1

              ;;

          esac


          case "$TURSO_DEV_DATABASE_URL" in

            *stockwave-prod*)

              echo "::error::PROD database detected. Workflow aborted."

              exit 1

              ;;

          esac


          echo "[PASS] DEV secrets configured"
          echo "[PASS] PROD protection"


      # ======================================================
      # Dependencies
      # ======================================================

      - name: Install Python dependencies
        run: |

          python -m pip install --upgrade pip

          python -m pip install -r requirements-daily.txt


      - name: Validate Python dependencies
        run: |

          python -c "import libsql; import dotenv; print('[PASS] libsql import'); print('[PASS] python-dotenv import')"


      # ======================================================
      # Syntax
      # ======================================================

      - name: Validate Daily Pipeline scripts
        run: |

          python -m py_compile \
            scripts/sync_stock_master.py \
            scripts/sync_market_index_incremental.py \
            scripts/sync_daily_price_incremental.py \
            scripts/sync_institutional_incremental.py \
            scripts/daily_incremental_pipeline.py \
            scripts/sync_v3_industry_sector.py \
            scripts/build_v3_sector_snapshot.py

          echo "[PASS] Daily Pipeline syntax validation"


      # ======================================================
      # DAILY DATA
      # ======================================================

      - name: Run Daily Incremental Pipeline
        run: |

          THROUGH="${{ inputs.through }}"

          SKIP_STOCK_MASTER="${{ inputs.skip_stock_master }}"

          ARGS=()


          if [ -n "$THROUGH" ]; then

            echo "Manual through date: $THROUGH"

            ARGS+=(
              --through
              "$THROUGH"
            )

          else

            echo "Through date: Taiwan today"

          fi


          if [ "$SKIP_STOCK_MASTER" = "true" ]; then

            echo "Stock Master: SKIPPED for manual retry"

            ARGS+=(
              --skip-stock-master
            )

          else

            echo "Stock Master: ENABLED"

          fi


          python scripts/daily_incremental_pipeline.py "${ARGS[@]}"


      # ======================================================
      # V3 SECTOR
      # ======================================================

      - name: Sync V3 Official Industry Sectors
        run: |

          python scripts/sync_v3_industry_sector.py


      - name: Build V3 Sector Daily Snapshot
        run: |

          python scripts/build_v3_sector_snapshot.py


      # ======================================================
      # Success
      # ======================================================

      - name: Workflow completed
        if: success()
        run: |

          echo "========================================"
          echo "StockWaveScanner V3"
          echo "Daily Incremental DEV completed"
          echo "Sector snapshot completed"
          echo "Runner: Windows"
          echo "========================================"