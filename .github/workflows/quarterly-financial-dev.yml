name: StockWaveScanner V2 Quarterly Financial DEV

on:
  schedule:
    # Taiwan Monday-Friday 19:37
    # UTC Monday-Friday 11:37
    #
    # Source is checked every weekday.
    # If no new financial quarter is available,
    # the incremental script safely no-ops.
    - cron: "37 11 * * 1-5"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stockwavescanner-quarterly-financial-dev
  cancel-in-progress: false

jobs:
  quarterly-financial:
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

      TURSO_DEV_DATABASE_URL: ${{ secrets.TURSO_DEV_DATABASE_URL }}
      TURSO_DEV_AUTH_TOKEN: ${{ secrets.TURSO_DEV_AUTH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-daily.txt

      - name: Python runtime
        run: |
          python --version
          python -c "import sys; print('Python executable:', sys.executable)"
          python -c "print('UTF-8 test: 季財報 / 營業收入 / 每股盈餘')"

      - name: Validate DEV secrets
        run: |
          if [ -z "$TURSO_DEV_DATABASE_URL" ]; then
            echo "ERROR: TURSO_DEV_DATABASE_URL is missing"
            exit 1
          fi

          if [ -z "$TURSO_DEV_AUTH_TOKEN" ]; then
            echo "ERROR: TURSO_DEV_AUTH_TOKEN is missing"
            exit 1
          fi

          case "$TURSO_DEV_DATABASE_URL" in
            *stockwave-dev*)
              ;;
            *)
              echo "ERROR: Database is not stockwave-dev"
              exit 1
              ;;
          esac

          case "$TURSO_DEV_DATABASE_URL" in
            *stockwave-prod*)
              echo "ERROR: PROD database detected"
              exit 1
              ;;
          esac

          echo "DEV database safety check PASS"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-daily.txt

      - name: Compile Quarterly Financial pipeline
        run: |
          python -m py_compile scripts/sync_quarterly_financial_incremental.py

      - name: Run Quarterly Financial incremental pipeline
        run: |
          python scripts/sync_quarterly_financial_incremental.py