name: StockWaveScanner V3 UI DEV

on:

  workflow_dispatch:

  schedule:

    # Taiwan every day 21:20
    # UTC every day 13:20
    - cron: "20 13 * * *"


  push:

    branches:
      - main

    paths:
      - "docs/**"
      - "scripts/export_v2_ui_snapshot.py"
      - "scripts/build_v2_scores.py"
      - "scripts/build_v3_ui_snapshot.py"
      - "scripts/export_v3_sectors.py"
      - "scripts/export_v3_etfs.py"
      - ".github/workflows/publish-v2-ui-dev.yml"


permissions:
  contents: read


concurrency:

  group: stockwavescanner-v3-ui-dev

  cancel-in-progress: true


jobs:

  build-ui:

    name: Build V3 UI

    runs-on: windows-latest


    env:

      PYTHONUNBUFFERED: "1"

      PYTHONUTF8: "1"

      PYTHONIOENCODING: "utf-8"

      TURSO_DEV_DATABASE_URL:
        ${{ secrets.TURSO_DEV_DATABASE_URL }}

      TURSO_DEV_AUTH_TOKEN:
        ${{ secrets.TURSO_DEV_AUTH_TOKEN }}


    steps:

      # ======================================================
      # Checkout
      # ======================================================

      - name: Checkout
        uses: actions/checkout@v7


      # ======================================================
      # Python
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v7

        with:

          python-version: "3.13"

          cache: "pip"

          cache-dependency-path:
            requirements-daily.txt


      # ======================================================
      # Dependencies
      # ======================================================

      - name: Install dependencies
        shell: bash

        run: |

          python -m pip install --upgrade pip

          python -m pip install \
            -r requirements-daily.txt


      # ======================================================
      # DEV SAFETY
      # ======================================================

      - name: Validate DEV secrets
        shell: bash

        run: |

          if [ -z "$TURSO_DEV_DATABASE_URL" ]; then

            echo "ERROR: TURSO_DEV_DATABASE_URL missing"

            exit 1

          fi


          if [ -z "$TURSO_DEV_AUTH_TOKEN" ]; then

            echo "ERROR: TURSO_DEV_AUTH_TOKEN missing"

            exit 1

          fi


          case "$TURSO_DEV_DATABASE_URL" in

            *stockwave-dev*)
              ;;

            *)

              echo "ERROR: Database is not stockwave-dev"

              exit 1

              ;;

          esac


          case "$TURSO_DEV_DATABASE_URL" in

            *stockwave-prod*)

              echo "ERROR: PROD database detected"

              exit 1

              ;;

          esac


          echo "[PASS] DEV database safety check"


      # ======================================================
      # Syntax
      # ======================================================

      - name: Validate V3 UI scripts
        shell: bash

        run: |

          python -m py_compile \
            scripts/export_v2_ui_snapshot.py \
            scripts/build_v2_scores.py \
            scripts/export_v3_sectors.py \
            scripts/export_v3_etfs.py \
            scripts/build_v3_ui_snapshot.py

          echo "[PASS] V3 UI scripts syntax validation"


      # ======================================================
      # BASE SNAPSHOT
      # ======================================================

      - name: Export V2 Base Snapshot
        shell: bash

        run: |

          python \
            scripts/export_v2_ui_snapshot.py


      # ======================================================
      # V3 STOCK SCORE
      # ======================================================

      - name: Build V2 Score Engine
        shell: bash

        run: |

          python \
            scripts/build_v2_scores.py


      # ======================================================
      # V3 SECTOR DOMAIN
      # ======================================================

      - name: Export V3 Sector Domain
        shell: bash

        run: |

          python \
            scripts/export_v3_sectors.py


      # ======================================================
      # V3 ETF DOMAIN
      # ======================================================

      - name: Export V3 ETF Domain
        shell: bash

        run: |

          python \
            scripts/export_v3_etfs.py


      # ======================================================
      # V3 UI
      # ======================================================

      - name: Build V3 UI Snapshot
        shell: bash

        run: |

          python \
            scripts/build_v3_ui_snapshot.py


      # ======================================================
      # Validation
      # ======================================================

      - name: Validate generated V3 data
        shell: bash

        run: |

          if [ ! -f "docs/data/latest/v3_ui.json" ]; then

            echo "ERROR: docs/data/latest/v3_ui.json was not generated"

            exit 1

          fi


          if [ ! -f "docs/data/latest/sectors.json" ]; then

            echo "ERROR: docs/data/latest/sectors.json was not generated"

            exit 1

          fi


          if [ ! -f "docs/data/latest/etfs.json" ]; then

            echo "ERROR: docs/data/latest/etfs.json was not generated"

            exit 1

          fi


          echo "[PASS] v3_ui.json"

          echo "[PASS] sectors.json"

          echo "[PASS] etfs.json"

      - name: Show generated files
        shell: bash

        run: |

          echo "Generated UI data:"

          ls -lah \
            docs/data/latest


      # ======================================================
      # Artifact
      # ======================================================

      - name: Upload generated site
        uses: actions/upload-artifact@v4

        with:

          name:
            stockwavescanner-v3-ui

          path:
            docs

          if-no-files-found:
            error

          retention-days:
            1


  # ==========================================================
  # GitHub Pages
  # ==========================================================

  deploy-pages:

    name: Deploy GitHub Pages

    needs:
      - build-ui

    runs-on:
      ubuntu-latest


    permissions:

      contents: read

      pages: write

      id-token: write


    environment:

      name:
        github-pages

      url:
        ${{ steps.deployment.outputs.page_url }}


    steps:

      - name: Download generated site
        uses: actions/download-artifact@v4

        with:

          name:
            stockwavescanner-v3-ui

          path:
            docs


      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5


      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4

        with:

          path:
            docs


      - name: Deploy GitHub Pages
        id: deployment

        uses: actions/deploy-pages@v4